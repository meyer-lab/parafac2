[project]
name = "parafac2"
version = "1.5.0"
description = "An implementation of PARAFAC2 that handles sparsity for single cell data."
authors = [{name = "Aaron Meyer", email = "git@asmlab.org" }]
license = "MIT"
requires-python = ">= 3.13"

dependencies = [
    "numpy>=2.2",
    "scipy>=1.18",
    "tensorly>=0.8.1",
    "tqdm>=4.68",
    "anndata>=0.12",
]

[project.optional-dependencies]
gpu = [
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "cupy-cuda12x[ctk]; sys_platform != 'darwin'",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ty>=0.0.50",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.28",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
