[project]
name = "parafac2"
version = "1.5.0"
description = "An implementation of PARAFAC2 that handles sparsity for single cell data."
authors = [{name = "Aaron Meyer", email = "git@asmlab.org" }]
license = "MIT"
requires-python = ">= 3.13"

dependencies = [
    "numpy>=2.2",
    "scipy>=1.18",
    "tensorly>=0.8.1",
    "tqdm>=4.68",
    "anndata>=0.12",
]

[project.optional-dependencies]
gpu = [
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "cupy-cuda12x[ctk]; sys_platform != 'darwin'",
]
# SciPy's sparse @ dense kernels are single-threaded, and those products
# dominate the fit. Installing this swaps in multithreaded MKL equivalents.
mkl = ["sparse-dot-mkl>=0.9; platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ty>=0.0.50",
]
docs = [
    "sphinx>=8.1",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "sphinx-autodoc-typehints>=2.5",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
