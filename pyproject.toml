[project]
name = "parafac2"
version = "1.7.0"
description = "An implementation of PARAFAC2 that handles sparsity for single cell data."
readme = "README.md"
authors = [{name = "Aaron Meyer", email = "git@asmlab.org" }]
license = "MIT"
requires-python = ">= 3.13"
keywords = ["parafac2", "tensor decomposition", "single-cell", "anndata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=2.2",
    "scipy>=1.18",
    "tensorly>=0.8.1",
    "tqdm>=4.68",
    "anndata>=0.12",
]

[project.urls]
Homepage = "https://github.com/meyer-lab/parafac2"
Documentation = "https://meyer-lab.github.io/parafac2/"
Repository = "https://github.com/meyer-lab/parafac2"
Issues = "https://github.com/meyer-lab/parafac2/issues"

[project.optional-dependencies]
gpu = [
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "cupy-cuda12x[ctk]; sys_platform != 'darwin'",
    # cuSPARSE's legacy CSR-by-dense routine (what CuPy's own `@` uses) is
    # int32-index-only and silently corrupts results above ~2^31 nonzeros;
    # nvmath-python's generic-API SpMM binding supports int64 indices, so
    # sparse matmul/rmatmul are routed through it instead (see backend.py).
    "nvmath-python; sys_platform != 'darwin'",
]
# SciPy's sparse @ dense kernels are single-threaded, and those products
# dominate the fit. Installing this swaps in multithreaded MKL equivalents.
mkl = ["sparse-dot-mkl>=0.9; platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ty>=0.0.50",
    "hypothesis>=6.100",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.28",
]

[tool.ty.rules]
# mlx/cupy imports are guarded per-platform (see the `gpu` extra above), so
# these `ty: ignore[unresolved-import]` comments are only unused on whichever
# platform actually has the package installed.
unused-ignore-comment = "ignore"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
