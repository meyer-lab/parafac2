name: Test

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install GPU dependencies
        if: matrix.os == 'macos-14'
        run: uv sync --extra gpu
      - name: Lint with ruff
        run: uv run ruff check parafac2
      - name: Check formatting with ruff
        run: uv run ruff format --check parafac2
      - name: Type check with ty
        run: uv run ty check parafac2
      - name: Test with pytest
        run: uv run pytest --cov

  build-cuda:
    # Self-hosted runners execute the checked-out code directly, so only run
    # this job for pushes and for PRs from branches within this repo (not
    # forks), avoiding arbitrary code execution from untrusted contributors.
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra gpu
      - name: Lint with ruff
        run: uv run ruff check parafac2
      - name: Check formatting with ruff
        run: uv run ruff format --check parafac2
      - name: Type check with ty
        run: uv run ty check parafac2
      - name: Test with pytest
        run: uv run pytest --cov
